name: OxideDebug
version: '${version}'
main: dev.oxide.plugin.OxidePlugin
# Substituted from gradle.properties (mcApiVersion) at build time — see
# build.gradle.kts processResources. Never hardcode this string directly.
api-version: '${apiVersion}'
folia-supported: true
# STARTUP, not the default POSTWORLD: Bukkit resolves a world's `generator:` mapping from
# bukkit.yml while that world is loading, which happens before POSTWORLD plugins are enabled.
load: STARTUP
description: >-
  Oxide chunk generation engine (Rust/Panama FFI) and Pacside native off-heap
  packet streamer, predictive trajectory prefetcher, and unified action-bar HUD.
author: Oxide
commands:
  oxide:
    description: Oxide chunk-provenance debug tools and generator test commands.
    usage: /oxide debug <on|off> | /oxide here | /oxide createworld <name> [seed] | /oxide pacside
  pacside:
    description: Pacside off-heap chunk cache and predictive trajectory prefetcher.
    usage: /pacside hud [on|off] | /pacside fetch <radius> | /pacside stats | /pacside clear
permissions:
  oxide.debug:
    description: Allows toggling and querying the Oxide chunk-provenance debug overlay.
    default: op
  oxide.pacside:
    description: Allows managing the Pacside predictive chunk prefetcher and off-heap cache.
    default: op
  oxide.createworld:
    description: Allows creating a new world generated by the Rust oxide-chunkgen generator.
    default: op
