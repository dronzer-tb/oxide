name: OxideDebug
version: '${version}'
main: dev.oxide.plugin.OxidePlugin
# Substituted from gradle.properties (mcApiVersion) at build time — see
# build.gradle.kts processResources. Never hardcode this string directly.
api-version: '${apiVersion}'
folia-supported: true
description: >-
  Debug-only overlay: shows via the action bar whether the chunk a player is
  standing in was generated by Oxide (Rust) or vanilla Java. Read-only
  diagnostic, not part of chunk generation or routing.
author: Oxide
commands:
  oxide:
    description: Oxide chunk-provenance debug tools.
    usage: /oxide debug <on|off> | /oxide here
permissions:
  oxide.debug:
    description: Allows toggling and querying the Oxide chunk-provenance debug overlay.
    default: op
