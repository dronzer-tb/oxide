# Optional override: path to a compiled oxide-ffi native library (liboxide_ffi.so on Linux).
# Leave it pointing at nothing and the linux-x86_64 library embedded in this jar by CI is
# extracted into this plugin's data folder and used instead. Set it only to run a locally
# built .so without rebuilding the jar. Single-platform scope cut for wave 5 -- see
# docs/ARCHITECTURE.md -- no per-OS/arch resolution beyond the one embedded library.
native-library-path: ""

# Root of a vanilla-exported worldgen datapack: the folder that directly contains
# version.json and data/<namespace>/worldgen/... A relative path is tried against the
# server's working directory first, then against this plugin's data folder, so both
# "datapack" and "plugins/OxideDebug/datapack" find plugins/OxideDebug/datapack.
# Absolute paths are used as given. See docs/REFERENCE_DATA.md for how to extract one.
datapack-path: "datapack"

# Optional override for which worldgen dimension every world is generated as. (Replaces the
# old `dimension-id` key, which defaulted to minecraft:overworld -- an upgraded install would
# otherwise have kept that value and forced its nether to generate overworld terrain.) Left empty --
# the default -- each world is generated as what it actually is: a nether world gets
# minecraft:the_nether (netherrack, lava, 0..128), the end gets minecraft:the_end, everything
# else gets minecraft:overworld. Set it only to force one dimension's terrain into a world
# that is not that dimension.
#
# The datapack must contain data/<namespace>/dimension/<name>.json for whichever dimensions are
# used; the vanilla data generator does not emit those, so they are written by hand. See
# docs/REFERENCE_DATA.md.
dimension-override: ""

# Worlds opt into this generator in bukkit.yml, not here:
#
#   worlds:
#     world:
#       generator: OxideDebug
#
# Chunks are then generated with that world's own seed, so new terrain continues the world
# the players are already in. Append a seed to override it: `generator: OxideDebug:12345`.
# Only chunks that do not exist yet are affected -- a world's existing chunks are on disk and
# are never regenerated, so expect a seam where new terrain meets old. Read
# OxideChunkGenerator's class doc before pointing a world you care about at this.
