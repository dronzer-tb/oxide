# ---------------------------------------------------------------------------
# Folia API Maven coordinate version.
#
# CONFIRMED 2026-08-22: dev.folia:folia-api maven-metadata.xml at
# repo.papermc.io lists 26.2.build.5-beta as <latest>/<release> — a real
# resolvable beta build targeting MC 26.2, matching this project's pinned
# target (see docs/ARCHITECTURE.md). Still beta upstream; re-check
# maven-metadata.xml if a stable 26.2 release lands:
#   https://repo.papermc.io/repository/maven-public/dev/folia/folia-api/maven-metadata.xml
foliaApiVersion=26.2.build.5-beta

# paper-plugin.yml `api-version`. Pinned to the project's target MC version
# per docs/ARCHITECTURE.md. Confirmed buildable now that foliaApiVersion
# above resolves against a real 26.2 Folia API build.
mcApiVersion=26.2

# dev.folia:folia-api:26.2.build.5-beta requires JVM 25+ (confirmed via CI
# failure 2026-08-22: "compatible with JVM runtime version 25 or newer").
javaVersion=25
pluginVersion=0.1.0-SNAPSHOT

# dev.vertex:vertex-engine-api, the compile-time API for the Vertex Engine module half of
# this jar (dev.oxide.plugin.vertex). compileOnly: on a Vertex server the engine supplies it,
# on stock Paper/Folia it is absent and the plugin half runs alone -- see
# OxidePlugin#vertexOwnsGeneration.
vertexApiVersion=0.1.0-SNAPSHOT
