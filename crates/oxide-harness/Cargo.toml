[package]
name = "oxide-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oxide-harness"
path = "src/main.rs"

[dependencies]
oxide-core.workspace = true
oxide-datapack.workspace = true
oxide-noise.workspace = true
oxide-biome.workspace = true
oxide-chunkgen.workspace = true
oxide-structures.workspace = true
oxide-anvil.workspace = true
fastnbt.workspace = true
blake3.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
# Sampling profiler for the optimization pass: `--features profile` plus `--profile-out
# <file.svg>` writes a flamegraph of a generation run. Off by default so the shipped binary
# carries no SIGPROF handler.
profile = ["dep:pprof"]
